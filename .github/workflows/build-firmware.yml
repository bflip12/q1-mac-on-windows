# Builds the firmware from this repo's keymap on top of Keychron's QMK tree.
# Push to main or open a PR: .bin uploaded as a workflow artifact.
# Push a tag like v1.0: .bin attached to a GitHub release.
name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["firmware/**", ".github/workflows/**"]
  pull_request:
    paths: ["firmware/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the Release step creates a GitHub release
    container: ghcr.io/qmk/qmk_cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Keychron QMK (playground branch)
        run: |
          git clone --depth 1 -b playground https://github.com/Keychron/qmk_firmware.git qmk
          cd qmk && git submodule update --init --recursive --depth 1
          # Record the exact upstream commit so each release names its full source (GPL).
          QMK_SHA="$(git rev-parse HEAD)"
          echo "Keychron QMK commit: $QMK_SHA"
          echo "QMK_SHA=$QMK_SHA" >> "$GITHUB_ENV"

      # The qmk_cli image lacks some packages Keychron's tree requires, and QMK
      # refuses to build without them. Install them into QMK's own Python.
      - name: Install QMK Python requirements
        run: |
          PY="$(dirname "$(readlink -f "$(command -v qmk)")")/python3"
          echo "QMK Python: $PY"
          if command -v uv >/dev/null 2>&1; then
            uv pip install --python "$PY" -r qmk/requirements.txt
          else
            "$PY" -m pip install -r qmk/requirements.txt
          fi

      - name: Add keymap and build
        run: |
          KM=qmk/keyboards/keychron/q1v2/ansi_encoder/keymaps/mac_fnlock
          mkdir -p "$KM" && cp firmware/keymap.c firmware/config.h firmware/rules.mk "$KM/"
          cd qmk && make keychron/q1v2/ansi_encoder:mac_fnlock
          cp .build/keychron_q1v2_ansi_encoder_mac_fnlock.bin ../q1-mac-firmware.bin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: q1-mac-firmware
          path: q1-mac-firmware.bin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: |
            Firmware for the Keychron Q1 V2 (ANSI, knob), `mac_fnlock` keymap, built by CI.

            - `q1-mac-firmware.bin`: flash with QMK Toolbox. Steps: [firmware/README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/firmware/README.md#flash-windows)
            - `q1-via-definition.json`: load in usevia.app (Design tab) for the Indicators menu and the Fn Lock key.

            Source: this repo at `${{ github.ref_name }}`, built on [Keychron/qmk_firmware@${{ env.QMK_SHA }}](https://github.com/Keychron/qmk_firmware/tree/${{ env.QMK_SHA }}) (`playground` branch). Licence: GPL-2.0-or-later.
          files: |
            q1-mac-firmware.bin
            via/q1-via-definition.json
